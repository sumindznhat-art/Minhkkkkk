<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Tài Xỉu MD5</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:radial-gradient(circle at 30% 10%,#1a1a2e,#0f0c29 55%,#000);color:#fff;overflow-x:hidden}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:rgba(0,0,0,.55);border-bottom:1px solid rgba(255,255,255,.1);position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
h1{font-size:1.1rem;background:linear-gradient(90deg,#ff6b6b,#feca57,#48dbfb);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.api-status{display:flex;align-items:center;gap:7px;font-size:.78rem;padding:5px 12px;border-radius:30px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.dot{width:9px;height:9px;border-radius:50%;background:#666}
.dot.online{background:#2ecc71;box-shadow:0 0 10px #2ecc71;animation:pulse 1.4s infinite}
.dot.offline{background:#e74c3c}
.dot.loading{background:#feca57;animation:pulse .8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.layout{display:grid;grid-template-columns:1fr 400px;gap:12px;padding:12px;height:calc(100vh - 56px)}
@media(max-width:900px){.layout{grid-template-columns:1fr;height:auto}}

.game-frame{background:#000;border:2px solid rgba(255,255,255,.1);border-radius:14px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.6);display:flex;flex-direction:column;min-height:500px}
.frame-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:rgba(0,0,0,.6);border-bottom:1px solid rgba(255,255,255,.08);font-size:.8rem}
.frame-header .title{color:#feca57;font-weight:700}
.frame-header a,.frame-header button{font-size:.72rem;padding:4px 10px;border-radius:6px;background:rgba(102,126,234,.3);border:1px solid rgba(102,126,234,.5);color:#fff;text-decoration:none;cursor:pointer;margin-left:5px}
.game-frame iframe{flex:1;width:100%;border:none;background:#000;min-height:480px}

/* SIDE PANEL */
.side{display:flex;flex-direction:column;gap:14px;overflow-y:auto;padding-right:4px}
.side::-webkit-scrollbar{width:6px}
.side::-webkit-scrollbar-thumb{background:#667eea;border-radius:3px}

/* Ô TRÒN KẾT QUẢ LỚN */
.result-section{
  background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.12);
  border-radius:18px;padding:20px;
  display:flex;flex-direction:column;align-items:center;gap:14px;
  box-shadow:0 8px 30px rgba(0,0,0,.4);
}
.session-label{
  font-size:.7rem;color:#888;text-transform:uppercase;letter-spacing:2px;
}
.session-value{
  font-family:'Courier New',monospace;font-size:1.3rem;font-weight:800;color:#feca57;
}

/* Ô TRÒN CHÍNH */
.circle{
  width:170px;height:170px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.08),rgba(0,0,0,.6));
  border:4px solid rgba(255,255,255,.15);
  transition:all .5s ease;
  position:relative;
}
.circle::before{
  content:'';position:absolute;inset:-8px;border-radius:50%;
  border:2px dashed rgba(255,255,255,.08);
  animation:spinSlow 20s linear infinite;
}
@keyframes spinSlow{to{transform:rotate(360deg)}}
.circle.tai{
  border-color:#ff6b6b;
  box-shadow:0 0 40px rgba(255,107,107,.5),inset 0 0 40px rgba(255,107,107,.2);
}
.circle.xiu{
  border-color:#48dbfb;
  box-shadow:0 0 40px rgba(72,219,251,.5),inset 0 0 40px rgba(72,219,251,.2);
}
.circle.pulse{animation:circlePulse .6s ease}
@keyframes circlePulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.08)}
  100%{transform:scale(1)}
}
.circle-text{
  font-size:2.6rem;font-weight:900;letter-spacing:4px;line-height:1;
}
.circle.tai .circle-text{color:#ff6b6b;text-shadow:0 0 20px rgba(255,107,107,.8)}
.circle.xiu .circle-text{color:#48dbfb;text-shadow:0 0 20px rgba(72,219,251,.8)}
.circle-text.idle{color:#555;font-size:1.1rem;letter-spacing:2px}
.circle-sub{
  font-size:.72rem;color:#aaa;margin-top:6px;font-family:'Courier New',monospace;
}

/* DICE */
.dice-row{display:flex;justify-content:center;gap:8px}
.die{
  width:38px;height:38px;background:linear-gradient(145deg,#fff,#d5d5d5);
  border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:1.2rem;font-weight:900;color:#111;
  box-shadow:0 3px 8px rgba(0,0,0,.5),inset 0 -2px 5px rgba(0,0,0,.15);
}
.die.spin{animation:spinDie .5s ease}
@keyframes spinDie{0%{transform:rotateY(0)}50%{transform:rotateY(180deg) scale(1.15)}100%{transform:rotateY(360deg)}}

/* NÚT DỰ ĐOÁN */
.btn-predict{
  width:100%;padding:14px;
  background:linear-gradient(135deg,#667eea,#764ba2);
  border:none;border-radius:12px;
  color:#fff;font-size:1rem;font-weight:800;
  letter-spacing:1px;cursor:pointer;
  box-shadow:0 6px 20px rgba(102,126,234,.4);
  transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-predict:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(102,126,234,.6)}
.btn-predict:active{transform:translateY(0)}
.btn-predict:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* KẾT QUẢ DỰ ĐOÁN */
.predict-result{
  width:100%;
  padding:14px;border-radius:12px;
  background:rgba(0,0,0,.4);
  border:2px dashed rgba(102,126,234,.4);
  text-align:center;min-height:80px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:all .4s;
}
.predict-result.has-value{border-style:solid;border-color:rgba(102,126,234,.6);background:rgba(102,126,234,.1)}
.predict-label{font-size:.65rem;color:#888;text-transform:uppercase;letter-spacing:2px;margin-bottom:6px}
.predict-value{font-size:2rem;font-weight:900;letter-spacing:4px;line-height:1}
.predict-value.tai{color:#ff6b6b;text-shadow:0 0 20px rgba(255,107,107,.6)}
.predict-value.xiu{color:#48dbfb;text-shadow:0 0 20px rgba(72,219,251,.6)}
.predict-value.idle{color:#555;font-size:1rem;letter-spacing:1px}
.predict-meta{font-size:.7rem;color:#a8b3ff;margin-top:6px}

/* LỊCH SỬ - DÃY Ô TRÒN NHỎ */
.history-section{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.1);
  border-radius:14px;padding:14px;
}
.history-section h2{
  font-size:.85rem;color:#feca57;margin-bottom:12px;
  display:flex;align-items:center;justify-content:space-between;
}
.badge{font-size:.62rem;padding:2px 8px;background:rgba(102,126,234,.3);border-radius:20px;color:#a8b3ff}
.history-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(72px,1fr));
  gap:8px;
}
.h-item{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 2px;border-radius:10px;
  background:rgba(0,0,0,.3);
  cursor:default;
  animation:slideIn .35s ease;
}
@keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.h-circle{
  width:44px;height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:.95rem;
  border:2px solid rgba(255,255,255,.15);
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.08),rgba(0,0,0,.5));
}
.h-circle.tai{border-color:#ff6b6b;color:#ff6b6b;box-shadow:0 0 12px rgba(255,107,107,.4)}
.h-circle.xiu{border-color:#48dbfb;color:#48dbfb;box-shadow:0 0 12px rgba(72,219,251,.4)}
.h-session{font-size:.6rem;color:#888;font-family:monospace}
.h-dice{font-size:.62rem;color:#ccc;font-family:monospace}
.h-sum{font-size:.6rem;color:#feca57;font-weight:700}

/* TOAST */
.toast{position:fixed;top:70px;right:20px;padding:11px 18px;border-radius:10px;color:#fff;font-size:.85rem;font-weight:700;background:#2ecc71;opacity:0;transform:translateX(120%);transition:.35s;z-index:999;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translateX(0)}
.toast.tai{background:#e74c3c}
.toast.xiu{background:#0984e3}
.toast.error{background:#e74c3c}
.toast.info{background:#0984e3}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<header>
  <h1>🎲 Live Tài Xỉu MD5</h1>
  <div class="api-status">
    <span class="dot loading" id="statusDot"></span>
    <span id="statusText">Kết nối...</span>
  </div>
</header>

<div class="layout">
  <!-- IFRAME GAME -->
  <div class="game-frame">
    <div class="frame-header">
      <span class="title">🎮 Game</span>
      <div>
        <button onclick="reloadGame()">🔄 Reload</button>
        <a href="https://lc79b.bet" target="_blank">↗ Tab mới</a>
      </div>
    </div>
    <iframe id="gameFrame" src="https://lc79b.bet" allowfullscreen referrerpolicy="no-referrer"></iframe>
  </div>

  <!-- SIDE PANEL -->
  <div class="side">
    <!-- Ô TRÒN KẾT QUẢ -->
    <div class="result-section">
      <div style="text-align:center">
        <div class="session-label">Phiên hiện tại</div>
        <div class="session-value" id="liveSession">--</div>
      </div>

      <div class="circle idle" id="resultCircle">
        <div class="circle-text idle" id="circleText">CHỜ</div>
        <div class="circle-sub" id="circleSub">--</div>
      </div>

      <div class="dice-row" id="diceRow">
        <div class="die">?</div><div class="die">?</div><div class="die">?</div>
      </div>

      <!-- NÚT DỰ ĐOÁN TIẾP -->
      <button class="btn-predict" id="predictBtn" onclick="doPredict()">
        🔮 DỰ ĐOÁN TIẾP
      </button>

      <!-- KẾT QUẢ DỰ ĐOÁN -->
      <div class="predict-result" id="predictResult">
        <div class="predict-label">Dự đoán phiên tiếp</div>
        <div class="predict-value idle" id="predictValue">Nhấn nút để dự đoán</div>
        <div class="predict-meta" id="predictMeta"></div>
      </div>
    </div>

    <!-- LỊCH SỬ -->
    <div class="history-section">
      <h2>📜 Lịch Sử <span class="badge" id="historyCount">0</span></h2>
      <div class="history-grid" id="historyGrid">
        <div style="grid-column:1/-1;text-align:center;padding:18px;color:#555;font-style:italic;font-size:.82rem">
          Chưa có phiên nào...
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const API = ''; // '' → cùng domain
const POLL_MS = 3000;
let lastSession = null;
let pollTimer = null;

/* ===== TOAST ===== */
function toast(msg, cls = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (cls ? ' ' + cls : '');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.className = 'toast', 3200);
}

/* ===== BEEP ===== */
function beep(f = 880) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = f; o.type = 'sine';
    g.gain.setValueAtTime(.12, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .25);
    o.start(); o.stop(ctx.currentTime + .25);
  } catch (e) {}
}

/* ===== API ===== */
async function api(path, options = {}) {
  const ctrl = new AbortController();
  const to = setTimeout(() => ctrl.abort(), 20000);
  try {
    const res = await fetch(API + path, {
      headers: { 'Content-Type': 'application/json' },
      signal: ctrl.signal, ...options
    });
    clearTimeout(to);
    const ct = res.headers.get('content-type') || '';
    const body = ct.includes('json') ? await res.json() : await res.text();
    return { ok: res.ok, status: res.status, body };
  } catch (e) {
    clearTimeout(to);
    return { ok: false, error: e.message };
  }
}

/* ===== STATUS ===== */
function setStatus(cls, txt) {
  document.getElementById('statusDot').className = 'dot ' + cls;
  document.getElementById('statusText').textContent = txt;
}

/* ===== PARSE ===== */
function parseRec(rec) {
  if (!rec || typeof rec !== 'object') return null;
  let dice = rec.dice || [];
  dice = (Array.isArray(dice) ? dice : []).map(Number).filter(n => n >= 1 && n <= 6);
  const sum = rec.sum ?? dice.reduce((a, b) => a + b, 0);
  const result = rec.result ?? (sum >= 11 ? 'tài' : 'xỉu');
  const type = rec.type ?? (sum >= 11 ? 'tai' : 'xiu');
  return { session: String(rec.session ?? '--'), dice, sum, result, type };
}

/* ===== RENDER Ô TRÒN CHÍNH ===== */
function renderLive(rec) {
  document.getElementById('liveSession').textContent = rec.session;

  const circle = document.getElementById('resultCircle');
  const text = document.getElementById('circleText');
  const sub = document.getElementById('circleSub');
  const diceRow = document.getElementById('diceRow');

  const newClass = 'circle ' + rec.type + (rec.session !== lastSession ? ' pulse' : '');
  circle.className = newClass;
  text.className = 'circle-text ' + rec.type;
  text.textContent = rec.type === 'tai' ? 'TÀI' : 'XỈU';
  sub.textContent = 'Σ ' + rec.sum;

  diceRow.innerHTML = rec.dice.map(d => `<div class="die spin">${d}</div>`).join('');

  if (lastSession !== null && rec.session !== lastSession) {
    beep(rec.type === 'tai' ? 1000 : 700);
    toast(`Phiên #${rec.session} → ${rec.result.toUpperCase()} (${rec.sum})`, rec.type);
  }
  lastSession = rec.session;
}

/* ===== RENDER LỊCH SỬ DẠNG Ô TRÒN NHỎ ===== */
function renderHistory(list) {
  const grid = document.getElementById('historyGrid');
  document.getElementById('historyCount').textContent = list.length;

  if (!list.length) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:18px;color:#555;font-style:italic;font-size:.82rem">Chưa có phiên nào...</div>';
    return;
  }

  grid.innerHTML = list.map(r => {
    const label = r.type === 'tai' ? 'T' : 'X';
    return `
      <div class="h-item" title="Phiên #${r.session} - ${r.dice.join('-')} = ${r.sum} (${r.result})">
        <div class="h-circle ${r.type}">${label}</div>
        <div class="h-session">#${r.session.slice(-4)}</div>
        <div class="h-dice">${r.dice.join('-')}</div>
        <div class="h-sum">Σ ${r.sum}</div>
      </div>
    `;
  }).join('');
}

/* ===== NÚT DỰ ĐOÁN TIẾP ===== */
async function doPredict() {
  const btn = document.getElementById('predictBtn');
  const box = document.getElementById('predictResult');
  const val = document.getElementById('predictValue');
  const meta = document.getElementById('predictMeta');

  btn.disabled = true;
  btn.innerHTML = '⏳ Đang dự đoán...';
  val.className = 'predict-value idle';
  val.textContent = 'Đang tính...';
  meta.textContent = '';

  const r = await api('/api/predict');

  btn.disabled = false;
  btn.innerHTML = '🔮 DỰ ĐOÁN TIẾP';

  if (!r.ok) {
    val.textContent = 'Lỗi: ' + (r.error || r.status);
    val.className = 'predict-value idle';
    toast('Không lấy được dự đoán', 'error');
    return;
  }

  const pred = r.body?.prediction || '';
  const conf = r.body?.confidence;
  const nextSession = r.body?.next_session;
  const reason = r.body?.reason || '';

  const s = String(pred).toUpperCase();
  if (s.includes('TÀI') || s.includes('TAI')) {
    val.className = 'predict-value tai';
    val.textContent = 'TÀI';
  } else if (s.includes('XỈU') || s.includes('XIU')) {
    val.className = 'predict-value xiu';
    val.textContent = 'XỈU';
  } else {
    val.className = 'predict-value idle';
    val.textContent = s || '--';
  }

  box.classList.add('has-value');
  const confPct = conf != null ? Math.round(Number(conf) * 100) + '%' : '--';
  meta.textContent = `Phiên #${nextSession || '?'} · Tin cậy ${confPct} · ${reason}`;

  beep(pred.toLowerCase().includes('tài') ? 1000 : 700);
  toast(`Dự đoán phiên #${nextSession}: ${val.textContent}`, val.className.includes('tai') ? 'tai' : 'xiu');
}

/* ===== POLL ===== */
async function poll() {
  setStatus('loading', 'Đang tải...');

  const h = await api('/api/history?limit=50');
  if (!h.ok) {
    setStatus('offline', 'Mất kết nối');
    return;
  }

  const list = Array.isArray(h.body?.history) ? h.body.history : [];
  if (list.length) {
    const recs = list.map(parseRec).filter(Boolean);
    renderLive(recs[0]);
    renderHistory(recs);
  } else {
    renderHistory([]);
  }

  setStatus('online', 'Online — auto cập nhật');
}

/* ===== RELOAD GAME ===== */
function reloadGame() {
  const f = document.getElementById('gameFrame');
  f.src = f.src;
  toast('Đang tải lại game...', 'info');
}

/* ===== START ===== */
window.addEventListener('DOMContentLoaded', () => {
  poll();
  pollTimer = setInterval(poll, POLL_MS);
});
</script>
</body>
</html>
